name: Web E2E

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "package-lock.json"
      - "shared/**"
      - "web/**"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This is the agreed placeholder contract. Add test:e2e and Playwright
      # dependencies/configuration to the 100x-web workspace to enable it.
      - name: Run Playwright end-to-end tests
        run: npm run test:e2e -w 100x-web
