name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Deployment quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Build and deploy API
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      SERVICE: ${{ vars.GCP_STAGING_CLOUD_RUN_SERVICE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION REPOSITORY SERVICE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub variable ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/api"
          tag="${GITHUB_SHA}"
          docker build --file backend/Dockerfile --tag "${image}:${tag}" .
          docker push "${image}:${tag}"
          digest="$(gcloud artifacts docker images describe "${image}:${tag}" \
            --project="${PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Artifact Registry returned an invalid digest"
            exit 1
          }
          echo "uri=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Deploy digest to staging
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${{ steps.image.outputs.uri }}" \
            --quiet

      - name: Write deployment summary
        run: |
          {
            echo "## Staging deployment"
            echo
            echo "- Service: \`${SERVICE}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image digest: \`${{ steps.image.outputs.digest }}\`"
            echo
            echo "Promote this exact digest with the **Promote to Production** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
